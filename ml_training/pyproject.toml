[project]
name = "ml-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irakliskhirtladze", email = "irskhirtladze@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "pillow>=12.1.0",
    "python-dotenv>=1.2.1",
    "torch>=2.9.0",
    "huggingface-hub==0.34.6",
    "transformers>=4.48.0",
    "accelerate>=0.26.0",
    "hf-xet>=1.2.0",
    "scikit-learn>=1.6.1",
    "evaluate>=0.4.6",
    "datasets>=3.6.0",
    "pyarrow>=19.0.0",
    "jiwer>=3.1.0",
    "matplotlib>=3.10.0",
    "albumentations>=2.0.8",
    "torchvision>=0.24.1",
    "tensorboard"
]

[project.scripts]
main = "ml_training.main:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"